<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/stage-icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#ffffff" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" href="/stage-icon.svg" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="2AMSTAGE" />
    <meta
      name="description"
      content="2AMSTAGE — Beli tiket konser favoritmu. Cepat, aman, dan penuh energi panggung."
    />
    <title>2AMSTAGE — Live The Night</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <script>
      // Runs before React mounts so there's no flash of the wrong theme.
      // Mirrors the logic in src/store/themeStore.js's init().
      (function () {
        try {
          var stored = JSON.parse(localStorage.getItem("2amstage-theme"));
          var mode =
            stored && stored.state && stored.state.mode
              ? stored.state.mode
              : window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
          if (mode === "dark") document.documentElement.classList.add("dark");
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-void text-hi font-body antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
